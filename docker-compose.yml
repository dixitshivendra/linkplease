services:
  api:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - API_KEY=${API_KEY}
      - BASE_URL=${BASE_URL:-https://pseudogram-api.onrender.com}
      - DATABASE_URL=sqlite:///./linkplease.db
      - PORT=${PORT:-8000}
    volumes:
      - db-data:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r = httpx.get('http://localhost:8000/health'); assert r.status_code == 200"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  worker:
    build: .
    command: python -m app.worker
    environment:
      - API_KEY=${API_KEY}
      - BASE_URL=${BASE_URL:-https://pseudogram-api.onrender.com}
      - DATABASE_URL=sqlite:///./linkplease.db
    volumes:
      - db-data:/app
    depends_on:
      api:
        condition: service_healthy
    restart: on-failure

volumes:
  db-data:
